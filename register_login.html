<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseHub - Register/Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">CourseHub</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="register_login.html">Login/Register</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="auth-container grid-container">
            <div class="form-section">
                <h2>Login</h2>
                <form id="loginForm" onsubmit="return validateLogin()">
                    <div class="form-group">
                        <label for="loginEmail">Email:</label>
                        <input type="email" id="loginEmail" name="email">
                        <span class="error" id="loginEmailError"></span>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password:</label>
                        <input type="password" id="loginPassword" name="password">
                        <span class="error" id="loginPasswordError"></span>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
            </div>
            <div class="form-section">
                <h2>Register</h2>
                <form id="registerForm" onsubmit="return validateRegistration()">
                    <div class="form-group">
                        <label for="regName">Name:</label>
                        <input type="text" id="regName" name="name">
                        <span class="error" id="regNameError"></span>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email:</label>
                        <input type="email" id="regEmail" name="email">
                        <span class="error" id="regEmailError"></span>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password:</label>
                        <input type="password" id="regPassword" name="password">
                        <span class="error" id="regPasswordError"></span>
                    </div>
                    <div class="form-group">
                        <label for="regConfirmPassword">Confirm Password:</label>
                        <input type="password" id="regConfirmPassword" name="confirmPassword">
                        <span class="error" id="regConfirmPasswordError"></span>
                    </div>
                    <button type="submit" class="btn">Register</button>
                    <div id="regSuccess" class="success"></div>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 CourseHub. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
